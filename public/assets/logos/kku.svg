  <text x="80" y="121" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2.5">KKU</text>
  <text x="80" y="142" font-family="'Sarabun', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">KHON KAEN UNIVERSITY</text>
