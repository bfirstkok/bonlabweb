      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="60%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="kkuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="80" cy="80" r="74" fill="url(#kkuRed)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
  <circle cx="80" cy="80" r="66" fill="none" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Phra That Kham Kaen Pagoda Silhouette -->
