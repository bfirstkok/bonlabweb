  <text x="80" y="142" font-family="'Sarabun', Arial, sans-serif" font-size="7" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">สำนักงานการวิจัยแห่งชาติ (วช.)</text>
