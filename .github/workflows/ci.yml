name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check server.js
      - run: node scripts/test-apify.mjs
      - name: Smoke test (server in DATA_DIR mode)
        env:
          DATA_DIR: ${{ runner.temp }}/data
          PORT: "8000"
          BONLAB_ADMIN_USER: ci
          BONLAB_ADMIN_PASSWORD: ci-password
          BONLAB_SESSION_SECRET: ci-secret
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          for p in / /news.html /api/news /admin/ /admin/news.html /assets/script.js; do
            curl -fsS -o /dev/null -w "%{http_code} $p\n" "http://127.0.0.1:8000$p"
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/admin/news)
          [ "$code" = "401" ] || { echo "admin API not protected: $code"; exit 1; }

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bfirstkok/bonlabweb
          # main -> :main (staging follows it), v1.2.0 -> :v1.2.0 (production pins it), every build -> :sha-xxxxxxx
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
